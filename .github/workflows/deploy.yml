name: CI - Build & Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          PUBLIC_GA_ID: ${{ secrets.PUBLIC_GA_ID }}

  # Deploy agora é feito automaticamente pela Vercel via integração com o GitHub.
  # O job de deploy para o Raspberry Pi foi removido, mas a infra Docker/Nginx
  # permanece no repositório como fallback em docker/ para uso manual se necessário.
